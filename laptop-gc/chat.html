<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Laptop GC Overlay</title>
<script>
/* =====================================================================
   CONFIG — edit names, messages, timings (seconds) and colors here
   ===================================================================== */
const CONFIG = {
  colors: {
    background: "#00B140",   // chroma-key green
    myBubble:   "#0A84FF",
    myText:     "#FFFFFF",
    theirBubble:"#E9E9EB",
    theirText:  "#000000",
    label:      "#FFFFFF",   // name labels + status text (drawn with a dark shadow)
    cardHeading:"#E5262D",
    cardBg:     "#FFFFFF",
    cardText:   "#1C1C1E",
    cardMeta:   "#6C6C70",
    typingDots: "#8E8E93",
  },

  layout: {
    columnWidth: 700,        // px, centered
    top: 90,                 // px from the top where the stack starts
    fontSize: 28,            // px, bubble text
    maxBubble: 0.78,         // bubble max width as a share of the column
    gap: 10,                 // px between bubbles in the same group
    groupGap: 26,            // px between groups (different senders)
  },

  // Messages in order. from: "me" or a name. typingAt: when the typing dots appear (incoming only).
  messages: [
    { from: "me", at: 1.0, card: {
        source: "Campus Updates · shared post",
        heading: "BREAKING ANNOUNCEMENT",
        body: "Classes are suspended tomorrow due to an emergency! Please share this information immediately!" } },
    { from: "me", at: 2.3, text: "GUYS! No classes tomorrow! Look!",
      status: [
        { at: 2.3, text: "Sent" },
        { at: 2.8, text: "Delivered" },
        { at: 3.6, text: "Seen by 7" },
        { at: 5.6, text: "Seen by 19" },
        { at: 8.0, text: "Seen by 34" },
      ] },
    { from: "Dio",   typingAt: 4.0, at: 5.0, text: "Totoo ba?" },
    { from: "Dio",                  at: 6.2, text: "YES! Finally! Walang pasok tomorrow!" },
    { from: "Carlo", typingAt: 7.5, at: 9.0, text: "Wait, suspended? So di ko na need mag-prepare for the presentation?" },
  ],

  popIn: 0.3,     // seconds each bubble pops in
  holdEnd: 2.0,   // seconds to hold the final frame
  fps: 30,
};
</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 1920px; height: 1080px; overflow: hidden; font-family: Inter, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  #col { position: absolute; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; }
  .slot { display: flex; flex-direction: column; }
  .slot.me { align-items: flex-end; }
  .slot.them { align-items: flex-start; }
  .pop { will-change: transform, opacity; }
  .shadowed { filter: drop-shadow(0 3px 5px rgba(0,0,0,0.22)) drop-shadow(0 8px 18px rgba(0,0,0,0.18)); }
  .bwrap { position: relative; }
  .bubble { line-height: 1.32; padding: 13px 21px; border-radius: 26px; overflow-wrap: break-word; }
  .tail { position: absolute; bottom: 0; width: 24px; height: 28px; display: none; overflow: visible; }
  .me .tail { right: -10px; }
  .them .tail { left: -10px; transform: scaleX(-1); }
  .bwrap.tailed .tail { display: block; }
  .label { font-size: 20px; font-weight: 600; margin: 0 0 6px 16px; text-shadow: 0 1px 3px rgba(0,0,0,0.7), 0 0 8px rgba(0,0,0,0.35); }
  .status { font-size: 19px; font-weight: 500; margin: 7px 8px 0 0; height: 24px; text-shadow: 0 1px 3px rgba(0,0,0,0.7), 0 0 8px rgba(0,0,0,0.35); }

  .card { width: 540px; border-radius: 24px; overflow: hidden; }
  .card .bar { height: 9px; }
  .card .cb { padding: 18px 24px 20px; }
  .card .src { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 500; }
  .card .src .pg { width: 32px; height: 32px; border-radius: 8px; background: #1F4FA8; color: #fff; font-size: 13px; font-weight: 700; display: grid; place-items: center; }
  .card h3 { margin: 14px 0 8px; font-size: 29px; font-weight: 800; letter-spacing: 0.3px; }
  .card p { margin: 0; font-size: 23px; line-height: 1.4; }

  .dots { display: flex; align-items: center; gap: 8px; height: 58px; padding: 0 24px; border-radius: 29px; }
  .dots span { width: 12px; height: 12px; border-radius: 50%; display: block; }
</style>
</head>
<body>
<div id="col"></div>
<script>
const C = CONFIG, K = C.colors, L = C.layout;
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeBack = x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

document.body.style.background = K.background;
const col = document.getElementById("col");
col.style.top = L.top + "px";
col.style.width = L.columnWidth + "px";

const tailSvg = color => `<svg class="tail" viewBox="0 0 24 28" preserveAspectRatio="none"><path d="M0 0 L14 0 C14 13 16 21 24 26 C15 27.5 7 25.5 0 21 Z" fill="${color}"/></svg>`;

const slots = [];
C.messages.forEach((m, i) => {
  const me = m.from === "me";
  const prev = C.messages[i - 1];
  const firstOfGroup = !prev || prev.from !== m.from;
  const slot = document.createElement("div");
  slot.className = "slot " + (me ? "me" : "them");
  slot.style.marginTop = i === 0 ? "0" : (firstOfGroup ? L.groupGap : L.gap) + "px";
  const bg = me ? K.myBubble : K.theirBubble, fg = me ? K.myText : K.theirText;

  let body;
  if (m.card) {
    body = `<div class="bwrap"><div class="card" style="background:${K.cardBg}"><div class="bar" style="background:${K.cardHeading}"></div><div class="cb">
      <div class="src" style="color:${K.cardMeta}"><div class="pg">CU</div>${esc(m.card.source)}</div>
      <h3 style="color:${K.cardHeading}">${esc(m.card.heading)}</h3><p style="color:${K.cardText}">${esc(m.card.body)}</p></div></div></div>`;
  } else {
    body = `<div class="bwrap"><div class="bubble" style="background:${bg};color:${fg};font-size:${L.fontSize}px;max-width:${Math.round(L.columnWidth * L.maxBubble)}px">${esc(m.text)}</div>${tailSvg(bg)}</div>`;
  }
  slot.innerHTML =
    (!me && firstOfGroup ? `<div class="label" style="color:${K.label}">${esc(m.from)}</div>` : "") +
    `<div class="pop msg shadowed">${body}</div>` +
    (m.typingAt != null ? `<div class="pop typ shadowed"><div class="bwrap tailed"><div class="dots" style="background:${K.theirBubble}">
       <span style="background:${K.typingDots}"></span><span style="background:${K.typingDots}"></span><span style="background:${K.typingDots}"></span></div>${tailSvg(K.theirBubble)}</div></div>` : "") +
    (m.status ? `<div class="status" style="color:${K.label}"></div>` : "");
  col.appendChild(slot);
  slots.push({ m, me, slot, label: slot.querySelector(".label"), msg: slot.querySelector(".msg"), typ: slot.querySelector(".typ"),
               bw: slot.querySelector(".msg .bwrap"), status: slot.querySelector(".status"),
               dots: [...slot.querySelectorAll(".dots span")], start: m.typingAt ?? m.at });
});

const END = Math.max(...C.messages.map(m => m.at)) + C.popIn + C.holdEnd;

function pop(el, t0, t, me) {
  const p = (t - t0) / C.popIn;
  el.style.transformOrigin = me ? "right bottom" : "left bottom";
  el.style.transform = `scale(${0.4 + 0.6 * easeBack(p)})`;
  el.style.opacity = clamp(p / 0.5);
}

function render(t) {
  slots.forEach((s, i) => {
    const visible = t >= s.start;
    s.slot.style.display = visible ? "" : "none";
    if (!visible) return;
    const typing = s.typ && t < s.m.at;
    if (s.label) pop(s.label, s.start, t, false);
    if (s.typ) {
      s.typ.style.display = typing ? "" : "none";
      if (typing) {
        pop(s.typ, s.m.typingAt, t, false);
        s.dots.forEach((d, k) => {
          const ph = ((t - s.m.typingAt) * 1.6 - k * 0.2 + 10) % 1;
          const b = ph < 0.5 ? Math.sin(ph / 0.5 * Math.PI) : 0;
          d.style.opacity = 0.35 + 0.65 * b;
          d.style.transform = `scale(${0.8 + 0.3 * b})`;
        });
      }
    }
    s.msg.style.display = typing ? "none" : "";
    if (!typing) pop(s.msg, s.m.at, t, s.me);

    // tail on the last visible bubble of each group
    const next = slots[i + 1];
    const nextShown = next && t >= next.start && next.m.from === s.m.from;
    if (s.bw) s.bw.classList.toggle("tailed", !s.m.card && !nextShown);

    if (s.status) {
      const st = s.m.status.filter(x => t >= x.at).pop();
      s.status.textContent = st ? st.text : "";
      s.status.style.opacity = clamp((t - s.m.at) / C.popIn);
    }
  });
}

window.ready = document.fonts.ready.then(() => { render(0); return { END, FPS: C.fps }; });
window.render = render;

// live preview: open chat.html?play
if (location.search.includes("play")) window.ready.then(() => {
  const t0 = performance.now();
  const loop = () => { render(((performance.now() - t0) / 1000) % END); requestAnimationFrame(loop); };
  loop();
});
</script>
</body>
</html>
