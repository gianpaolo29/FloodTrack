<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Laptop GC Scene</title>
<script>
/* =====================================================================
   NT - 4101  ·  CONFIG — edit names, group, messages and timings here.
   All times are in seconds from the start of the clip.
   ===================================================================== */
window.CONFIG = {
  appName: "Usap",                       // fictional app name (title bar)
  duration: 14,                          // clip length (s)
  fps: 30,

  group: { name: "BSIT 2A Class GC", members: 42, color: "#5E5CE6", initials: "2A" },

  // Left sidebar (4 conversations). The one with active:true is highlighted.
  sidebar: [
    { name: "BSIT 2A Class GC", initials: "2A", color: "#5E5CE6", active: true },
    { name: "Mama",             initials: "M",  color: "#FF9F0A" },
    { name: "Jessa Reyes",      initials: "JR", color: "#30B0C7" },
    { name: "Org Officers",     initials: "OO", color: "#34C759" },
  ],

  // Messages already in the chat when the window opens.
  olderMessages: [
    { from: "Carlo Mendoza", initials: "CM", color: "#FF6B6B", text: "May quiz ba bukas?" },
    { from: "Bea Santos",    initials: "BS", color: "#AF52DE", text: "Wala pa announcement" },
  ],

  // Shared-post card that I (Student A) send.
  sharedPost: {
    at: 1.5,
    source: "Campus Updates · shared post",
    heading: "BREAKING ANNOUNCEMENT",
    body: "Classes are suspended tomorrow due to an emergency! Please share this information immediately!",
  },

  // Message I type in the composer, then send.
  typed: {
    text: "GUYS! No classes tomorrow! Look!",
    typeStart: 2.5,    // first character appears
    typeEnd: 4.6,      // last character appears
    sendAt: 5.0,       // becomes a blue bubble
  },

  // Status line under my sent message: [time, label]
  status: [
    [5.0, "Sent"],
    [5.8, "Delivered"],
    [7.0, "Seen by 7"],
    [8.4, "Seen by 19"],
    [9.8, "Seen by 34"],
  ],

  windowOpenAt: 0.5,     // window scales 90% → 100% and fades in
  windowOpenDur: 0.4,
  bubbleInDur: 0.3,      // each new bubble eases in over this long
  placeholder: "Type a message…",
};
</script>
<style>
  :root {
    --me: #0A84FF;
    --them: #E9E9EB;
    --text: #111;
    --muted: #6E6E73;
    --line: #E3E3E8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    font-family: "Inter", "DejaVu Sans", sans-serif;
    background: #CBD5E1;             /* plain desktop background */
    color: var(--text);
  }
  #win {
    position: absolute; left: 120px; top: 36px; width: 1680px; height: 1008px;
    background: #fff; border-radius: 22px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(15, 23, 42, .28), 0 0 0 1px rgba(0,0,0,.08);
    display: flex; flex-direction: column;
    transform-origin: 50% 50%;
  }
  #titlebar {
    height: 52px; flex: none; background: #F2F2F5; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; padding: 0 22px; gap: 10px; position: relative;
  }
  .dot { width: 16px; height: 16px; border-radius: 50%; background: #C7C7CC; }
  #titlebar .title {
    position: absolute; left: 0; right: 0; text-align: center;
    font-size: 22px; font-weight: 600; color: #48484A;
  }
  #body { flex: 1; display: flex; min-height: 0; }
  #sidebar {
    width: 390px; flex: none; background: #F7F7F9; border-right: 1px solid var(--line);
    padding: 22px 14px; display: flex; flex-direction: column; gap: 6px;
  }
  .conv { display: flex; align-items: center; gap: 18px; padding: 14px 16px; border-radius: 16px; }
  .conv.active { background: #DCEBFF; }
  .conv .name { font-size: 28px; font-weight: 600; white-space: nowrap; }
  .avatar {
    flex: none; border-radius: 50%; color: #fff; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .conv .avatar { width: 64px; height: 64px; font-size: 24px; }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #header {
    height: 100px; flex: none; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 22px; padding: 0 36px;
  }
  #header .avatar { width: 68px; height: 68px; font-size: 26px; }
  #header .h { font-size: 36px; font-weight: 700; white-space: nowrap; }
  #header .h span { color: var(--muted); font-weight: 500; }

  #messages {
    flex: 1; min-height: 0; overflow: hidden; position: relative;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 0 40px 14px;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 16px);
            mask-image: linear-gradient(to bottom, transparent 0, #000 16px);
  }
  .item { flex: none; overflow: visible; }
  .row { padding-top: 16px; display: flex; gap: 18px; align-items: flex-end; transform-origin: 50% 100%; }
  .row.me { justify-content: flex-end; transform-origin: 100% 100%; }
  .row.them { transform-origin: 0 100%; }
  .row .avatar { width: 60px; height: 60px; font-size: 22px; }
  .stack { display: flex; flex-direction: column; max-width: 900px; }
  .row.me .stack { align-items: flex-end; }
  .sender { font-size: 24px; color: var(--muted); font-weight: 600; margin: 0 0 4px 20px; }
  .bubble {
    font-size: 36px; line-height: 1.3; padding: 16px 28px; border-radius: 32px;
    overflow-wrap: break-word;
  }
  .them .bubble { background: var(--them); color: #000; }
  .me .bubble { background: var(--me); color: #fff; }
  .status { font-size: 24px; color: var(--muted); margin: 8px 10px 0 0; font-weight: 500; height: 30px; position: relative; min-width: 200px; text-align: right; }
  .status span { position: absolute; right: 0; top: 0; white-space: nowrap; }

  .card {
    width: 780px; background: #fff; border: 2px solid #D8D8DE; border-radius: 26px;
    padding: 24px 30px 28px; box-shadow: 0 6px 18px rgba(0,0,0,.06);
    border-left: 8px solid var(--me);
  }
  .card .src { display: flex; align-items: center; gap: 12px; font-size: 24px; color: var(--muted); font-weight: 600; }
  .card .src i { width: 30px; height: 30px; border-radius: 8px; background: #1F3A68; display: inline-block; }
  .card .hd { margin-top: 14px; font-size: 40px; font-weight: 800; color: #E0242B; letter-spacing: .5px; }
  .card .bd { margin-top: 10px; font-size: 34px; line-height: 1.35; color: #111; }

  #composer {
    height: 116px; flex: none; border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 22px; padding: 0 36px;
  }
  #field {
    flex: 1; height: 78px; border-radius: 39px; background: #F2F2F5; border: 2px solid #E5E5EA;
    display: flex; align-items: center; padding: 0 30px; font-size: 34px; white-space: nowrap; overflow: hidden;
  }
  #ph { color: #A1A1A6; }
  #caret { display: inline-block; width: 3px; height: 42px; background: var(--me); margin-left: 2px; vertical-align: middle; }
  #send {
    width: 78px; height: 78px; border-radius: 50%; flex: none; background: #C7C7CC;
    display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>
<div id="win">
  <div id="titlebar"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="title" id="appname"></div></div>
  <div id="body">
    <div id="sidebar"></div>
    <div id="main">
      <div id="header"></div>
      <div id="messages"></div>
      <div id="composer">
        <div id="field"><span id="typed"></span><span id="caret"></span><span id="ph"></span></div>
        <div id="send"><svg width="38" height="38" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      </div>
    </div>
  </div>
</div>
<script>
const C = window.CONFIG;
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = p => 1 - Math.pow(1 - p, 3);
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const av = (o) => `<div class="avatar" style="background:${o.color}">${esc(o.initials)}</div>`;

$("#appname").textContent = C.appName;
$("#sidebar").innerHTML = C.sidebar.map(c =>
  `<div class="conv${c.active ? " active" : ""}">${av(c)}<div class="name">${esc(c.name)}</div></div>`).join("");
$("#header").innerHTML = `${av(C.group)}<div class="h">${esc(C.group.name)} <span>· ${C.group.members} members</span></div>`;

// Build message items: { at, el, h }
const items = [];
function addItem(html, at) {
  const el = document.createElement("div");
  el.className = "item";
  el.innerHTML = html;
  $("#messages").appendChild(el);
  items.push({ at, el, row: el.firstElementChild, h: 0 });
}
for (const m of C.olderMessages) {
  addItem(`<div class="row them">${av(m)}<div class="stack"><div class="sender">${esc(m.from)}</div><div class="bubble">${esc(m.text)}</div></div></div>`, -Infinity);
}
const P = C.sharedPost;
addItem(`<div class="row me"><div class="stack"><div class="card"><div class="src"><i></i>${esc(P.source)}</div><div class="hd">${esc(P.heading)}</div><div class="bd">${esc(P.body)}</div></div></div></div>`, P.at);
const T = C.typed;
addItem(`<div class="row me"><div class="stack"><div class="bubble">${esc(T.text)}</div><div class="status" id="status"></div></div></div>`, T.sendAt);

// Measure natural heights once.
for (const it of items) it.h = it.el.getBoundingClientRect().height;

window.renderAt = function (t) {
  // Window open
  const wp = easeOut(clamp((t - C.windowOpenAt) / C.windowOpenDur));
  const win = $("#win");
  win.style.opacity = wp;
  win.style.transform = `scale(${0.9 + 0.1 * wp})`;

  // Messages: height grows (smooth scroll-up), bubble eases in
  for (const it of items) {
    const p = it.at === -Infinity ? 1 : easeOut(clamp((t - it.at) / C.bubbleInDur));
    it.el.style.height = (it.h * p) + "px";
    it.row.style.opacity = p;
    it.row.style.transform = `translateY(${(1 - p) * 24}px) scale(${0.94 + 0.06 * p})`;
  }

  // Status under my message (short crossfade between labels)
  let cur = -1;
  for (let i = 0; i < C.status.length; i++) if (t >= C.status[i][0]) cur = i;
  const st = $("#status");
  if (cur < 0) st.innerHTML = "";
  else {
    const f = clamp((t - C.status[cur][0]) / 0.2);
    const prev = cur > 0 ? `<span style="opacity:${1 - f}">${esc(C.status[cur - 1][1])}</span>` : "";
    const sb = C.status[cur][1].startsWith("Seen");
    st.innerHTML = prev + `<span style="opacity:${f};${sb ? "color:#0A84FF;font-weight:600" : ""}">${esc(C.status[cur][1])}</span>`;
  }

  // Composer typing
  const n = T.text.length;
  let shown = 0;
  if (t >= T.sendAt) shown = 0;
  else if (t >= T.typeStart) shown = Math.min(n, 1 + Math.floor((t - T.typeStart) / ((T.typeEnd - T.typeStart) / (n - 1))));
  const typing = t >= T.typeStart && t < T.sendAt;
  $("#typed").textContent = T.text.slice(0, shown);
  $("#ph").textContent = shown ? "" : C.placeholder;
  // Caret: solid while keys are being pressed, blinks (0.5s on/off) otherwise
  const activelyTyping = t >= T.typeStart && t < T.typeEnd + 0.15;
  const blinkOn = Math.floor((t - T.typeStart) / 0.5) % 2 === 0;
  const caretVisible = t >= C.windowOpenAt + C.windowOpenDur && (activelyTyping || blinkOn || t < T.typeStart && Math.floor(t / 0.5) % 2 === 0);
  const caret = $("#caret");
  caret.style.visibility = caretVisible ? "visible" : "hidden";
  // Put caret before placeholder when empty, after text when typing
  const send = $("#send");
  send.style.background = shown ? "#0A84FF" : "#C7C7CC";
  const press = t >= T.sendAt - 0.12 && t < T.sendAt + 0.08 ? 0.88 : 1;
  send.style.transform = `scale(${press})`;
};
window.renderAt(0);
window.__ready = true;
</script>
</body>
</html>
